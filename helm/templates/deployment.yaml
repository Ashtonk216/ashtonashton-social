apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-frontend
  labels:
    app.kubernetes.io/name: social-frontend
    app.kubernetes.io/instance: social-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: social-frontend
      app.kubernetes.io/instance: social-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: social-frontend
        app.kubernetes.io/instance: social-frontend
    spec:
      containers:
        - name: social-frontend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
